name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # `--group dev` installs the workspace packages plus pandas/optax:
        # `docs/api/api.md` and `docs/api/preprocessing.md` use mkdocstrings
        # to import `pyrox_nn.api` and `pyrox_nn.preprocessing`, both of
        # which need pandas (normally gated behind the [bnf] extra).
        run: uv sync --group docs --group dev

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force
