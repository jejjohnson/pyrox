name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests with coverage
        run: uv run pytest -v -m "not slow"
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Per-package LICENSE copies match the root LICENSE
        run: for f in packages/*/LICENSE; do cmp LICENSE "$f"; done
      - name: Build every package (sdist, then wheel from the sdist)
        run: uv build --all-packages -o dist
      - name: Every sdist and wheel carries the license text
        run: |
          for f in dist/*.tar.gz; do tar tzf "$f" | grep -q '/LICENSE$' || { echo "no LICENSE in $f"; exit 1; }; done
          for f in dist/*.whl; do unzip -l "$f" | grep -q 'dist-info/licenses/LICENSE' || { echo "no LICENSE in $f"; exit 1; }; done
