[project]
name = "pyrox-lgm"
version = "0.1.0"
description = "Latent Gaussian models on top of pyrox, gaussx and kernellib: GMRF components, PC priors and inla()."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "numpyro", "inla", "gmrf", "latent-gaussian-models"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# No pyrox-gp: latent Gaussian models are precision-form and need nothing
# from the covariance-form GP package (tests/test_import_guard.py).
dependencies = [
    "pyrox",
    "gaussx[numpyro]>=0.6.1",
    "kernellib>=0.0.15",
    "matfree>=0.6.0",
    "numpyro>=0.21",
    "optax>=0.2.8",
]

[project.optional-dependencies]
# `pip install pyrox-lgm[xarray]` returns INLAResult marginals as xarray objects.
xarray = [
    "xarray>=2025.1",
]

[project.urls]
Repository = "https://github.com/jejjohnson/pyrox"

[tool.uv.sources]
# Neither is on PyPI yet; resolve the release tags from GitHub, in step with
# pyrox-gp's sources (one version per package across the workspace).
gaussx = { git = "https://github.com/jejjohnson/gaussx.git", tag = "v0.6.1" }
kernellib = { git = "https://github.com/jejjohnson/kernellib.git", tag = "v0.0.15" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrox_lgm"]
