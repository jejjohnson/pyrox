[project]
name = "pyrox-lgm"
version = "0.1.4"
description = "Latent Gaussian models on top of pyrox, gaussx and kernellib: GMRF components, PC priors and inla()."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["jax", "equinox", "numpyro", "inla", "gmrf", "latent-gaussian-models"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# No pyrox-gp: latent Gaussian models are precision-form and need nothing
# from the covariance-form GP package (tests/test_import_guard.py).
dependencies = [
    "pyrox",
    "einx>=0.4.3",
    "gaussx>=0.7.0",
    "pyrox-gauss",
    "kernellib>=0.0.22",
    "matfree>=0.6.0",
    "numpyro>=0.21",
    "argminax[numpyro]>=0.0.6",
    "optimistix>=0.1.0",
    "functax[jax] @ git+https://github.com/jejjohnson/functax.git@v0.0.7",
]

[project.optional-dependencies]
# `pip install pyrox-lgm[xarray]` returns INLAResult marginals as xarray objects.
xarray = [
    "xarray>=2025.1",
]

[project.urls]
Repository = "https://github.com/jejjohnson/pyrox"

[tool.uv.sources]
# Neither is on PyPI yet; resolve the release tags from GitHub, in step with
# pyrox-gp's sources (one version per package across the workspace).
gaussx = { git = "https://github.com/jejjohnson/gaussx.git", tag = "v0.7.0" }
kernellib = { git = "https://github.com/jejjohnson/kernellib.git", tag = "v0.0.22" }
# The inner Newton loop of `inla()` (`argminax.solve.laplace_mode`), at the
# commit that adds `safe_implicit_adjoint` (v0.0.8 once tagged), in step with
# pyrox-nn's and pyrox-ssm's sources. argminax pins gaussx v0.6.13
# by URL; the root override keeps the workspace's one gaussx instead.
argminax = { git = "https://github.com/jejjohnson/argminax.git", rev = "089d61f33344a269694f345765f918675d323d1e" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# functax is declared via a PEP 508 direct URL until it ships to PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pyrox_lgm"]
