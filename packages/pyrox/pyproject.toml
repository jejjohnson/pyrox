[project]
name = "pyrox"
version = "0.0.1"
description = "Equinox-to-NumPyro bridge primitives (PyroxModule, Parameterized) and ensemble inference."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "numpyro", "probabilistic"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.10",
    "equinox>=0.13.8",
    "numpyro>=0.21",
    "einx>=0.4.3",
]

[project.optional-dependencies]
# `pip install pyrox[optax]` enables the ensemble-of-MAP inference path.
optax = [
    "optax>=0.2",
]

[project.urls]
Repository = "https://github.com/jejjohnson/pyrox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrox"]
