[project]
name = "pyrox-nn"
version = "0.2.0"
description = "Bayesian and uncertainty-aware neural network layers on top of pyrox, kernellib and geonnax, plus the BNF estimator API."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["jax", "equinox", "numpyro", "bayesian-neural-networks", "probabilistic"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "pyrox",
    "gaussx>=0.6.14",
    "kernellib>=0.0.22",
    "lineax>=0.1.1",
    "geonnax @ git+https://github.com/jejjohnson/geonnax.git@v0.0.11",
    "einx>=0.4.3",
    "argminax>=0.0.4",
]

[project.optional-dependencies]
optax = [
    "optax>=0.2.8",
]
# `pip install pyrox-nn[bnf]` bundles what the Bayesian Neural Field stack needs:
# pandas for `pyrox_nn.preprocessing` and optax for the SGD-MAP / SVI inference.
bnf = [
    "pandas>=3.0.3",
    "optax>=0.2.8",
]
# `pip install pyrox-nn[xarray]` gives a working `NeuralFieldEstimator`
# with `fit_xarray`: `pyrox_nn.api` imports pandas and the fits need optax
# (the `[bnf]` extra's dependencies), plus xarray itself.
xarray = [
    "pandas>=3.0.3",
    "optax>=0.2.8",
    "xarray>=2025.1",
]
# `pip install pyrox-nn[colab]` bundles what the example notebooks need to run
# top-to-bottom in Google Colab — matplotlib for plots, watermark for an
# explicit version readout at the top of each notebook.
colab = [
    "matplotlib>=3.10.9",
    "watermark>=2.6.0",
    "pandas>=3.0.3",
]

[project.urls]
Repository = "https://github.com/jejjohnson/pyrox"

[tool.uv.sources]
# Neither is on PyPI yet; resolve the release tags from GitHub, in step with
# pyrox-gp's and pyrox-lgm's sources (one version per package across the workspace).
gaussx = { git = "https://github.com/jejjohnson/gaussx.git", tag = "v0.6.14" }
kernellib = { git = "https://github.com/jejjohnson/kernellib.git", tag = "v0.0.22" }
# The curvature, evidence and prior-precision search of `last_layer_laplace`,
# at the v0.0.4 release. argminax pins gaussx v0.6.12 by URL; the root
# override keeps the workspace's one gaussx instead.
argminax = { git = "https://github.com/jejjohnson/argminax.git", rev = "v0.0.4" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# geonnax is declared via a PEP 508 direct URL until it ships to PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pyrox_nn"]
