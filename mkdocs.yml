site_name: pyrox
site_description: Probabilistic modeling with Equinox and NumPyro — Bayesian neural networks, Gaussian processes, and composable GP building blocks.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/pyrox
repo_name: jejjohnson/pyrox

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/pyrox/src, packages/pyrox-gp/src, packages/pyrox-nn/src, packages/pyrox-lgm/src, packages/pyrox-ssm/src, packages/pyrox-gauss/src, packages/pyrox-xtreme/src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
            # The SSM API re-exports several gaussx symbols (SDEKernel,
            # MaternSDE, ConstantSDE, …), and ``pyrox_nn`` re-exports
            # deterministic NN primitives from geonnax (SIREN, MFN,
            # conditioners, encoders, etc.) and feature bases from functax
            # (fourier_features, seasonal_features, seasonal_frequencies).
            # griffe must preload these external packages to resolve those
            # aliases; without this the render path raises
            # AliasResolutionError and the deploy fails.
            preload_modules: [gaussx, geonnax, functax]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Building with Agents: agents.md
  - Tutorials:
      - "Regression Masterclass — Pattern 1 (eqx.tree_at)": notebooks/regression_masterclass_treeat.ipynb
      - "Regression Masterclass — Pattern 2 (PyroxModule)": notebooks/regression_masterclass_pyrox_sample.ipynb
      - "Regression Masterclass — Pattern 3 (Parameterized)": notebooks/regression_masterclass_parameterized.ipynb
  - API Reference:
      - Overview: api/reference.md
      - Capability Index: capabilities.md
      - Core: api/core.md
      - Likelihoods: api/likelihoods.md
      - GP: api/gp.md
      - NN:
          - Overview: api/nn.md
          - Geo encoders: api/nn/geo_encoders.md
          - Conditioning: api/nn/conditioning.md
          - MFN: api/nn/mfn.md
      - LGM: api/lgm.md
      - SSM: api/ssm.md
      - Gauss: api/gauss.md
      - Xtreme:
