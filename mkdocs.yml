# ---------------------------------------------------------------------------
# Zensical builds ONLY the API reference from this file (it reads mkdocs.yml
# as is), and it is deployed as the `/reference/` subtree of the MyST site.
# Prose, guides and notebooks are built by mystmd from `docs/myst.yml`. See
# `docs/README.md` for the split and the rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: pyrox API reference
site_description: API reference for the pyrox workspace (pyrox, pyrox-gp, pyrox-nn, pyrox-lgm, pyrox-ssm, pyrox-gauss and pyrox-xtreme), generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/pyrox
repo_name: jejjohnson/pyrox

docs_dir: docs/api
site_dir: site

# The guide pages and notebooks live in the MyST half of the site, so links to
# them point outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead, across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  # Zensical's Material-compatible look; `modern` is its newer default.
  variant: classic
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/pyrox/src, packages/pyrox-gp/src, packages/pyrox-nn/src, packages/pyrox-lgm/src, packages/pyrox-ssm/src, packages/pyrox-gauss/src, packages/pyrox-xtreme/src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
            # The SSM API re-exports several gaussx symbols (SDEKernel,
            # MaternSDE, ConstantSDE, …), and ``pyrox_nn`` re-exports
            # deterministic NN primitives from geonnax (SIREN, MFN,
            # conditioners, encoders, etc.) and feature bases from functax
            # (fourier_features, seasonal_features, seasonal_frequencies).
            # griffe must preload these external packages to resolve those
            # aliases; without this the render path raises
            # AliasResolutionError and the deploy fails.
            preload_modules: [gaussx, geonnax, functax]

nav:
  - Overview: index.md
  - Core (pyrox):
      - Modules and sites: core.md
      - Likelihoods: likelihoods.md
      - Inference: inference.md
  - GP (pyrox-gp): gp.md
  - NN (pyrox-nn):
      - Layers: nn.md
      - Geo encoders: nn/geo_encoders.md
      - Conditioning: nn/conditioning.md
      - MFN: nn/mfn.md
      - Estimator: api.md
      - Preprocessing: preprocessing.md
  - LGM (pyrox-lgm): lgm.md
  - SSM (pyrox-ssm): ssm.md
  - Gauss (pyrox-gauss): gauss.md
  - Extremes (pyrox-xtreme):
      - Overview: xtreme/index.md
      - Distributions: xtreme/distributions.md
      - Primitives: xtreme/primitives.md
      - Extraction: xtreme/extraction.md
      - Point processes: xtreme/point-processes.md
      - Point-process primitives: xtreme/point-process-primitives.md
      - Point-process operators: xtreme/point-process-operators.md
      - Point-process distributions: xtreme/point-process-distributions.md
      - Simulations: xtreme/simulations.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
