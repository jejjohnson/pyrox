repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  # ruff runs from the locked `lint` dependency group (uv.lock) so pre-commit and
  # CI's lint workflow always use the same version; do not pin ruff-pre-commit.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
