# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, guides and the
# executed example notebooks. The API reference is built separately by Zensical
# + mkdocstrings and mounted at `/reference/`. See `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built API `site/` on this exact port, then rewrites the resulting localhost
# URLs to the deployed `/reference/` path. Keep the port in sync with API_PORT
# in that script.
# ---------------------------------------------------------------------------
version: 1

project:
  id: pyrox-docs
  title: pyrox
  description: >-
    Probabilistic modelling with Equinox and NumPyro: Gaussian processes,
    Bayesian neural networks, latent Gaussian and state-space models, and
