[project]
name = "pyrox-monorepo"
version = "0.0.0"
description = "Pyrox monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyrox = { workspace = true }
pyrox-gp = { workspace = true }
pyrox-nn = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    # Workspace members are dev-installed so tests can import them.
    "pyrox",
    "pyrox-gp",
    "pyrox-nn",
    # Optional-extra backends exercised by the test suites.
    "optax>=0.2",
    "pandas>=3.0.3",
]
lint = [
    "ruff>=0.15.12",
]
typecheck = [
    "ty>=0.0.38",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.10.9",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin to the last 2.19.x until a fixed pymdown-extensions
    # release ships.
    "pygments>=2.20.0,<2.21",
]
examples = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scikit-learn>=1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["design_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# F722 clashes with jaxtyping's string-based shape annotations (Array, "N D").
# RUF001/002/003 flag Greek letters, sub/superscripts, primes, and the
# multiplication sign in strings/docstrings/comments. These are intentional
# math notation throughout the array-heavy modules (einx specs, shape
# annotations, and Unicode equations), so suppress them there.
"packages/pyrox/src/pyrox/inference/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-gp/src/pyrox_gp/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-nn/src/pyrox_nn/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox/tests/inference/**" = ["F722"]
"packages/pyrox-gp/tests/**" = ["F722"]
"packages/pyrox-nn/tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"docs/notebooks/**" = [
    "F722",
    "B905",
    "B007",
    "E702",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = [
    "packages/pyrox/tests",
    "packages/pyrox-gp/tests",
    "packages/pyrox-nn/tests",
]
addopts = "--cov --cov-report=term-missing --cov-report=xml:coverage.xml"
markers = [
    "slow: long-running tests (convergence / integration); skip with `-m 'not slow'`",
]

[tool.coverage.run]
source = [
    "packages/pyrox/src",
    "packages/pyrox-gp/src",
    "packages/pyrox-nn/src",
]
omit = ["**/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
