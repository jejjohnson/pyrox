[project]
name = "pyrox-monorepo"
version = "0.0.0"
description = "Pyrox monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# kernellib's own `[tool.uv.sources]` pins gaussx and geonnax to their git tags
# (gaussx v0.6.5, geonnax v0.0.8 for kernellib v0.0.22; the override moves them to gaussx v0.8.3 (v0.7.0 was the first without NumPyro) and geonnax v0.0.11). uv honours that for a
# git dependency, which conflicts with the newer tags the workspace needs; the
# override keeps one gaussx and one geonnax for every member. Move it in step with pyrox-gp's gaussx and geonnax sources, and with the
# override snippet users copy from README.md (Installation).
# argminax v0.0.10 (pyrox-gp, pyrox-nn, pyrox-lgm, pyrox-ssm) pins gaussx v0.8.2 by URL; the same override replaces it.
# filterax v0.0.8 (pyrox-ssm's ensemble extra) pins gaussx v0.6.9 by URL; the same override replaces it.
# functax is pinned here at the tag pyrox-gp, pyrox-nn and pyrox-lgm declare, so one
# functax serves every member once an upstream (kernellib, geonnax) pins its own.
override-dependencies = [
    "gaussx @ git+https://github.com/jejjohnson/gaussx.git@v0.8.3",
    "geonnax @ git+https://github.com/jejjohnson/geonnax.git@v0.0.11",
    "functax[jax] @ git+https://github.com/jejjohnson/functax.git@v0.0.7",
]

[tool.uv.sources]
pyrox = { workspace = true }
pyrox-gp = { workspace = true }
pyrox-nn = { workspace = true }
pyrox-lgm = { workspace = true }
pyrox-ssm = { workspace = true }
pyrox-gauss = { workspace = true }
pyrox-xtreme = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    # Workspace members are dev-installed so tests can import them.
    "pyrox",
    "pyrox-gp",
    "pyrox-nn",
    "pyrox-lgm",
    # With the ensemble extra, so pyrox_ssm.ensemble's tests run in CI.
    "pyrox-ssm[ensemble]",
    "pyrox-gauss",
    # With the threshold extra, so the quantile-regression tests run in CI.
    "pyrox-xtreme[threshold]",
    # Optional-extra backends exercised by the test suites.
    "optax>=0.2.8",
    "pandas>=3.0.3",
    "xarray>=2025.1",
]
lint = [
    "ruff>=0.15.15",
]
typecheck = [
    "ty>=0.0.42",
]
docs = [
    # The prose half of the site (home page, guides and the executed notebooks)
    # is built by mystmd, a Node CLI installed with `npm install -g mystmd`
    # rather than through uv. Zensical (the successor to Material for MkDocs,
    # which reached end of life on 2026-11-05) builds only the API reference
    # from mkdocs.yml; its `objects.inv` is what lets the MyST prose
    # cross-reference into it. See docs/README.md.
    "zensical>=0.0.74",
    "mkdocstrings[python]>=1.0.8",
    # scripts/build_docs.py, which builds both halves and checks their links.
    "cyclopts>=4",
    "loguru>=0.7",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.10.9",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin to the last 2.19.x until a fixed pymdown-extensions
    # release ships.
    "pygments>=2.20.0,<2.22",
]
examples = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "design_docs",
    # The spatial-extremes tutorials ship pre-executed on CDS data that CI
    # cannot fetch; reformatting their sources would desynchronise code from
    # the committed outputs. Their `_helpers/` modules are linted as normal.
    "docs/xtreme/tutorials/spatial_extremes/**/*.ipynb",
]
# Honour the exclude even when pre-commit passes the files explicitly.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E402", "E721", "E731", "E741"]

# The Gaussian NumPyro distributions moved from gaussx to pyrox-gauss (#453).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gaussx.AbstractMultivariateNormal".msg = "moved to pyrox-gauss: from pyrox_gauss import AbstractMultivariateNormal (#453)"
"gaussx.MultivariateNormal".msg = "moved to pyrox-gauss: from pyrox_gauss import MultivariateNormal (#453)"
"gaussx.MultivariateNormalPrecision".msg = "moved to pyrox-gauss: from pyrox_gauss import MultivariateNormalPrecision (#453)"
"gaussx.MarkovGaussian".msg = "moved to pyrox-gauss: from pyrox_gauss import MarkovGaussian (#453)"
"gaussx.LGSSM".msg = "moved to pyrox-gauss: from pyrox_gauss import LGSSM (#453)"
"gaussx.MaskedLGSSM".msg = "moved to pyrox-gauss: from pyrox_gauss import MaskedLGSSM (#453)"
"gaussx.LGSSMFactory".msg = "moved to pyrox-gauss: from pyrox_gauss import LGSSMFactory (#453)"

[tool.ruff.lint.per-file-ignores]
# F722 clashes with jaxtyping's string-based shape annotations (Array, "N D").
# RUF001/002/003 flag Greek letters, sub/superscripts, primes, and the
# multiplication sign in strings/docstrings/comments. These are intentional
# math notation throughout the array-heavy modules (einx specs, shape
# annotations, and Unicode equations), so suppress them there.
"packages/pyrox/src/pyrox/inference/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox/src/pyrox/likelihoods.py" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-gp/src/pyrox_gp/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-nn/src/pyrox_nn/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-lgm/src/pyrox_lgm/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-ssm/src/pyrox_ssm/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-gauss/src/pyrox_gauss/**" = ["F722", "RUF001", "RUF002", "RUF003"]
# RUF012: NumPyro's Distribution interface needs class-level dict and list
# attributes (`arg_constraints`, `reparametrized_params`).
"packages/pyrox-xtreme/src/pyrox_xtreme/**" = ["F722", "RUF001", "RUF002", "RUF003", "RUF012"]
"packages/pyrox/tests/inference/**" = ["F722"]
"packages/pyrox-gp/tests/**" = ["F722"]
"packages/pyrox-nn/tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-lgm/tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-ssm/tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-gauss/tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"packages/pyrox-xtreme/tests/**" = ["F722", "RUF001", "RUF002", "RUF003", "RUF012"]
"docs/notebooks/**" = [
    "F722",
    "B905",
    "B007",
    "E702",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]
"docs/xtreme/**" = [
    "F722",
    "B905",
    "B007",
    "E702",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[tool.ruff.format]
# README code blocks keep a hand-aligned column of shape comments (one column
# per block, after the equation comment above each line). The formatter would
# collapse it to two spaces, so README files are left out of formatting only;
# they are still linted.
exclude = ["README.md", "packages/*/README.md"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

# pyrox-xtreme keeps the rule ignores it had as xtremax, over its ported NumPyro
# distribution classes, its scipy-backed simulation helpers and JAX scan and
# vmap outputs that ty does not narrow. Tightening them rule by rule is
# pyrox-xtreme's own task; the other packages stay on the default rules.
[[tool.ty.overrides]]
include = ["packages/pyrox-xtreme/src/**"]

[tool.ty.overrides.rules]
unsupported-operator = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
invalid-return-type = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
# NumPyro's `constraints.interval` is a class; ty reads its `__call__` as
# `(self, x)` rather than the constructor and flags two-argument construction.
too-many-positional-arguments = "ignore"

[tool.pytest.ini_options]
testpaths = [
    "packages/pyrox/tests",
    "packages/pyrox-gp/tests",
    "packages/pyrox-nn/tests",
    "packages/pyrox-lgm/tests",
    "packages/pyrox-ssm/tests",
    "packages/pyrox-gauss/tests",
    "packages/pyrox-xtreme/tests",
]
addopts = "--cov --cov-report=term-missing --cov-report=xml:coverage.xml"
markers = [
    "slow: long-running tests (convergence / integration); skip with `-m 'not slow'`",
    "integration: end-to-end workflows (MCMC fits through NumPyro, subprocess runs); pyrox-xtreme runs them in their own CI job",
]

[tool.coverage.run]
source = [
    "packages/pyrox/src",
    "packages/pyrox-gp/src",
    "packages/pyrox-nn/src",
    "packages/pyrox-lgm/src",
    "packages/pyrox-ssm/src",
    "packages/pyrox-gauss/src",
    "packages/pyrox-xtreme/src",
]
omit = ["**/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
